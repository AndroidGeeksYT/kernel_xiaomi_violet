name: v1.0-geek

on:
  push:
    branches: [ geek ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v6

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib \
          gcc-multilib git gnupg gperf libxml2 lib32z1-dev liblz4-tool libncurses5-dev \
          libsdl1.2-dev libssl-dev libxml2-utils lzop pngcrush rsync schedtool \
          squashfs-tools xsltproc zip zlib1g-dev python-is-python3 default-jdk libelf-dev llvm clang

      - name: Execute Build
        run: python3 build.py

      - name: Upload Kernel Artifact
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: Kernel-Build-${{ github.ref_name }}
          path: /home/runner/*-signed.zip

      - name: Upload Build Logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: compilation-logs
          path: error.log
